<style>

  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:#2c2c2e; --track:#2c2c2e;
      --bar:#5b8ff9; --bar-soft:#2d3f66; --ref:#8e8e93;
      --green:#4cd964; --red:#ff6b6b;
      --good-bg:#10261a; --good:#5fd38a; --warn-bg:#2b2010; --warn:#f5b449; --crit-bg:#2d1413; --crit:#ff8a80; --info-bg:#131d33; --info:#8fb0ff;
    }
  }
  :root { --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --in:#1baf7a; --out:#eb6834; --grid:#e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --in:#199e70; --out:#d95926; --grid:#2c2c2e; } }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
  .chips button { width:auto; margin:0; padding:7px 12px; border-radius:18px; background:var(--card); color:var(--text); font-size:14px; font-weight:500; white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .chips button.on { background:var(--text); color:var(--bg); }
  .sw { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .stack { display:flex; gap:2px; height:10px; border-radius:5px; overflow:hidden; margin:12px 0 4px; }

  .chart svg { display:block; overflow:visible; }
  .chart .tip { font-size:14px; min-height:40px; margin-top:6px; }
  .month { cursor:pointer; }
  :root { --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c9:#aeaeb2; }
  @media (prefers-color-scheme: dark) { :root { --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#636366; } }
  .seg { display:flex; background:var(--track); border-radius:10px; padding:2px; margin:0 0 10px; }
  .seg button { flex:1; margin:0; padding:7px 0; background:none; color:var(--text); font-size:14px; font-weight:500; border-radius:8px; }
  .seg button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.15); font-weight:600; }
  .pnav { display:flex; align-items:center; justify-content:space-between; margin:0 0 10px; font-weight:600; }
  .pnav button { width:40px; margin:0; padding:4px 0; background:none; color:var(--bar); font-size:26px; line-height:1; }
  .pnav button:disabled { color:var(--line); }
  .delta { font-size:14px; font-weight:600; margin-top:2px; } .delta span { color:var(--muted); font-weight:400; }
  .delta.up { color:var(--crit); } .delta.down { color:var(--good); }
  .catrow { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .catrow:last-child { border-bottom:0; }
  .grow { flex:1; min-width:0; } .chev { color:var(--muted); width:12px; text-align:center; }
  .sw.lg { width:12px; height:12px; border-radius:4px; }
  .catlist { padding:0 0 6px 24px; border-bottom:1px solid var(--line); }
  .insight { display:flex; gap:12px; padding:9px 0; line-height:1.4; font-size:15px; border-bottom:1px solid var(--line); }
  .insight:last-child { border-bottom:0; } .insight .bar { width:4px; border-radius:2px; flex:none; }
  .place { padding:8px 0; } .place .top { display:flex; justify-content:space-between; gap:10px; }
  .pbar { height:6px; background:var(--track); border-radius:3px; margin:6px 0 3px; overflow:hidden; } .pbar div { height:100%; border-radius:3px; }
  .bardetail { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); } .bardetail .top { display:flex; justify-content:space-between; margin-bottom:6px; }
  .mini { display:flex; gap:10px; align-items:center; padding:4px 0; font-size:15px; }
  .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet { position:fixed; inset:0; z-index:20; } .sheet-bg { position:absolute; inset:0; background:rgba(0,0,0,.4); }
  .sheet-card { position:absolute; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom) + 8px); background:var(--card); border-radius:16px; padding:14px; max-width:540px; margin:0 auto; animation:up .2s ease-out; }
  @keyframes up { from { transform:translateY(40px); opacity:0; } }
  .catpick { display:flex; gap:12px; align-items:center; background:none; color:var(--text); margin:0; padding:11px 8px; border-radius:10px; font-weight:500; text-align:left; }
  .catpick.on { background:var(--track); }
  .ptr { height:0; overflow:hidden; text-align:center; color:var(--muted); font-size:13px; transition:height .2s; }
  .ptr.show { height:34px; line-height:34px; }

  @keyframes flash { 0%, 30% { background:color-mix(in srgb, var(--bar) 22%, transparent); } 100% { background:transparent; } }
  .conn { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .conn:last-child { border-bottom:0; } .conn .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .mc-hero { font-size:38px; font-weight:750; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .mc-sub { font-size:14px; font-weight:600; margin-top:2px; min-height:20px; } .mc-sub span { color:var(--muted); font-weight:400; }
  .mc-chart { position:relative; margin:12px -4px 0; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .mc-chart svg { display:block; overflow:visible; }
  .mc-now { width:auto; margin:0; padding:4px 10px; font-size:13px; border-radius:14px; background:var(--track); color:var(--text); }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi .sub { font-size:12px; } .kpi .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rec { display:flex; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); } .rec:last-child { border-bottom:0; }
  .mtab { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  .mtab td, .mtab th { padding:7px 0; border-bottom:1px solid var(--line); text-align:right; } .mtab td:first-child, .mtab th:first-child { text-align:left; }
  .mtab th { color:var(--muted); font-weight:500; font-size:12px; }
  .ask-in { display:flex; gap:8px; } .ask-in input { flex:1; } .ask-in button { width:auto; margin:0; padding:0 16px; }
  .qa { padding:10px 0; border-bottom:1px solid var(--line); } .qa:last-child { border-bottom:0; }
  .qa .q { font-weight:600; font-size:15px; } .qa .a { font-size:15px; line-height:1.45; margin-top:4px; white-space:pre-wrap; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0 auto; background:var(--bg); color:var(--text); font:16px -apple-system, system-ui, sans-serif; max-width:560px;
         padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 90px); -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  header { display:flex; justify-content:space-between; align-items:center; padding:8px 0 4px; }
  header .title { font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .sync { font-size:12px; color:var(--muted); background:var(--card); border-radius:20px; padding:6px 10px; border:0; width:auto; margin:0; display:flex; gap:6px; align-items:center; font-weight:500; }
  .sync .dot { width:7px; height:7px; border-radius:50%; background:var(--good); }
  .sync.busy .dot { background:var(--bar); animation:pulse 1s infinite; }
  .sync.stale .dot { background:var(--warn); }
  @keyframes pulse { 50% { opacity:.25; } }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:color-mix(in srgb, var(--card) 88%, transparent);
        -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; max-width:180px; background:none; color:var(--muted); margin:0; padding:8px 0 6px; font-size:11px; font-weight:500; border-radius:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button svg { width:26px; height:26px; }
  nav button.on { color:var(--bar); }
  nav[hidden], [hidden] { display:none !important; }
  .view { animation:fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } }
  h1 { font-size:13px; font-weight:600; color:var(--muted); margin:20px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .sub { font-size:13px; color:var(--muted); }
  .amt { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .debit { color:var(--red); } .credit { color:var(--green); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .two .card { margin:0; }
  .big { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .hero { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .alert { display:flex; gap:10px; border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:15px; line-height:1.35; }
  .alert b { white-space:nowrap; }
  .alert { background:var(--card); color:var(--text); }
  .alert b { color:var(--muted); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.03em; padding-top:2px; }
  .meter { position:relative; height:12px; background:var(--track); border-radius:6px; margin:10px 0 6px; overflow:visible; }
  .meter .fill { position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--bar); }
  .meter .pace { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--text); border-radius:1px; }
  .meter.over .fill { background:var(--crit); }
  .cat { padding:8px 0; }
  .cat .top { display:flex; justify-content:space-between; font-size:15px; }
  .cat .meter { height:8px; margin:6px 0 2px; }
  .cat .meter .last { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ref); }
  svg text { fill:var(--muted); font-size:10px; }
  #tip { font-size:14px; min-height:20px; margin-top:4px; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  input, textarea, button { font:inherit; width:100%; border-radius:10px; border:1px solid var(--line); padding:12px; background:var(--card); color:var(--text); }
  button { background:var(--bar); color:#fff; border:0; font-weight:600; margin-top:8px; cursor:pointer; }
  .field { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:0; }
  .field input { width:130px; text-align:right; padding:8px 10px; }
  .field input[type=checkbox] { width:24px; height:24px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 76px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:14px; z-index:9; }
  .note { font-size:13px; color:var(--muted); margin:8px 0; }
  #lock { max-width:320px; margin:20vh auto 0; text-align:center; }
</style>
</head>
<body>
<div id="lock">
  <h1>Money</h1>
  <input id="url" type="url" placeholder="Paste your Web app URL (…/exec)" style="margin-bottom:8px">
  <p class="note" id="lockMsg"></p>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
  <input id="pin2" type="password" inputmode="numeric" placeholder="Type the new PIN again" style="margin-top:8px" hidden>
  <button onclick="unlock()">Open</button>
  <p class="note" id="err"></p>
</div>
<div class="ptr" id="ptr">Release to refresh</div>
<div id="app" hidden></div>
<nav id="nav" hidden>
  <button data-t="home" onclick="setTab('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-t="spend" onclick="setTab('spend')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Spending</button>
  <button data-t="money" onclick="setTab('money')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Analysis</button>
  <button data-t="settings" onclick="setTab('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<script>
// Exact amounts: ₹1,234.50 keeps its paise, ₹1,234 stays clean.
const inr = n => { const v = Math.round(Number(n || 0) * 100) / 100;
  return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const ago = iso => { const m = (Date.now() - new Date(iso)) / 60000; return m < 60 ? Math.max(1, Math.round(m)) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short' }); };
const ICON = { critical:'Over', warning:'Watch', good:'On track', info:'Note' };
// Runs two ways: inside Google's page (google.script.run) or as a stand-alone Home Screen app (fetch).
const IN_GOOGLE = !!(window.google && google.script && google.script.run);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
// Your server. Built in so you never have to paste it.
const BUILD = '__BUILD__';   // replaced on publish; the app reloads itself when a newer build is live
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbx_89qVHduJzbO_V24J36aoPk6fkId-RgIDZ4agAk3h33-DLOeyvNLFz7gaWoz5fZM_/exec';
let PIN = store.get('pin') || '', URL_ = store.get('url') || DEFAULT_URL, TAB = store.get('tab') || 'home';
let DATA = null, SYNCED = Number(store.get('synced') || 0), BUSY = false;
try { DATA = JSON.parse(store.get('data') || 'null'); } catch (e) {}
if (IN_GOOGLE || URL_) document.getElementById('url').hidden = true; else document.getElementById('url').value = URL_;

function api(action, extra) {
  if (IN_GOOGLE) return new Promise((ok, bad) => {
    const r = google.script.run.withFailureHandler(bad);
    if (action === 'summary') r.withSuccessHandler(ok).getSummary(PIN);
    else if (action === 'createPin') r.withSuccessHandler(ok).createPin(extra.newPin);
    else if (action === 'saveSettings') r.withSuccessHandler(ok).saveSettings(PIN, extra.settings);
    else r.withSuccessHandler(x => ok({ ok: true, result: x })).addManual(PIN, extra.text);
  });
  // text/plain keeps it a "simple" request, so Apps Script answers without a CORS preflight
  // Google sometimes answers with a random "not found" page, so try up to 4 times.
  const body = JSON.stringify(Object.assign({ action, pin: PIN }, extra || {}));
  const attempt = n => {
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl && setTimeout(() => ctl.abort(), 12000);   // never hang: give up on a request after 12s
    return fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ctl && ctl.signal })
      .then(r => r.text()).then(t => { clearTimeout(timer); return JSON.parse(t); })
      .catch(e => { clearTimeout(timer); if (n >= 1) throw e; return new Promise(ok => setTimeout(ok, 800)).then(() => attempt(n + 1)); });
  };
  return attempt(0);
}

let CREATING = false;
function unlock() {
  PIN = document.getElementById('pin').value.trim();
  document.getElementById('err').textContent = CREATING ? '' : 'Opening…';
  if (CREATING) {
    if (!/^\d{4,8}$/.test(PIN)) { document.getElementById('err').textContent = 'Use 4 to 8 digits.'; return; }
    if (PIN !== document.getElementById('pin2').value.trim()) { document.getElementById('err').textContent = 'The two PINs don’t match.'; return; }
    document.getElementById('err').textContent = 'Setting up…';
    api('createPin', { newPin: PIN }).then(r => {
      // "already set" can happen if an earlier try got through; just try opening with it
      if (!r.ok && r.error !== 'PIN already set') { document.getElementById('err').textContent = r.error; return; }
      CREATING = false; document.getElementById('pin2').hidden = true; sync(true);
    }).catch(() => { document.getElementById('err').textContent = 'No connection. Tap Open again.'; });
    return;
  }
  const typed = document.getElementById('url').value.trim();
  if (!IN_GOOGLE && typed) URL_ = typed;
  if (!URL_) URL_ = DEFAULT_URL;
  if (!IN_GOOGLE && !/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_)) { document.getElementById('err').textContent = 'That doesn’t look like your Web app URL (it ends in /exec).'; return; }
  sync(true);
}

function sync(fromLock) {
  if (BUSY || (!PIN && !fromLock)) return;
  BUSY = true; paintSync();
  api('summary').then(d => {
    BUSY = false;
    if (d && d.needsPin) { showCreatePin(); paintSync(); return; }
    if (!d || !d.ok) { if (fromLock === true || !DATA) showLock(PIN ? 'Wrong PIN' : ''); paintSync(); return; }
    const newest = (d.history || []).reduce((m, t) => Math.max(m, t[0]), 0);
    const fresh = SEEN_T ? (d.history || []).filter(t => t[0] > SEEN_T).length : 0;
    NEW_SINCE = SEEN_T; if (newest) { SEEN_T = newest; store.set('seenT', String(newest)); }
    if (fresh) toast(fresh + ' new payment' + (fresh > 1 ? 's' : ''));
    DATA = d; SYNCED = Date.now();
    store.set('pin', PIN); store.set('url', URL_); store.set('data', JSON.stringify(d)); store.set('synced', String(SYNCED));
    render();
    if (WANT_REFRESH) { WANT_REFRESH = false; refreshNow(); }
  }).catch(e => {
    BUSY = false; paintSync();
    if (!DATA) showLock('Couldn’t connect. Check the URL and your internet. (' + (e.message || e) + ')');
  });
}

function showCreatePin() {
  CREATING = true;
  showLock('');
  document.getElementById('lockMsg').textContent = 'Welcome! Create a PIN to protect your money info.';
  document.getElementById('pin').placeholder = 'New PIN (4–8 digits)';
  document.getElementById('pin2').hidden = false;
}

// Opening the app → also pull in brand-new bank emails right now (not just every 5 minutes)
let WANT_REFRESH = true, REFRESHING = false;
function refreshNow() {
  if (REFRESHING || !PIN) return;
  REFRESHING = true; BUSY = true; paintSync();
  api('refresh').then(d => {
    REFRESHING = false; BUSY = false;
    if (d && d.ok && d.added) { NEW_SINCE = SEEN_T; SEEN_T = (d.history || []).reduce((m, t) => Math.max(m, t[0]), SEEN_T); store.set('seenT', String(SEEN_T));
      DATA = d; toast(d.added + ' new payment' + (d.added > 1 ? 's' : '')); store.set('data', JSON.stringify(d)); render(); }
    SYNCED = Date.now(); store.set('synced', String(SYNCED)); paintSync();
  }).catch(() => { REFRESHING = false; BUSY = false; paintSync(); });
}

function showLock(msg) {
  document.getElementById('lock').hidden = false; document.getElementById('app').hidden = true; document.getElementById('nav').hidden = true;
  document.getElementById('err').textContent = msg || '';
}

function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const mins = (Date.now() - SYNCED) / 60000;
  el.className = 'sync' + (BUSY ? ' busy' : mins > 15 ? ' stale' : '');
  el.querySelector('span:last-child').textContent = BUSY ? 'Syncing…' : SYNCED ? 'Synced ' + (mins < 1 ? 'just now' : ago(new Date(SYNCED).toISOString())) : 'Not synced';
}

function setTab(t) { TAB = t; store.set('tab', t); render(); window.scrollTo(0, 0); }

function render() {
  const d = DATA;
  if (!d) return;
  document.getElementById('lock').hidden = true;
  const app = document.getElementById('app'), nav = document.getElementById('nav');
  app.hidden = false; nav.hidden = false;
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  const title = { home: 'Money', spend: 'Spending', money: 'Analysis', settings: 'Settings' }[TAB];
  app.innerHTML = `
    <header><div class="title">${title}</div><button id="sync" class="sync" onclick="sync()"><span class="dot"></span><span></span></button></header>
    <div class="view">${TAB === 'home' ? homeView(d) : TAB === 'spend' ? spendView(d) : TAB === 'settings' ? settingsView(d) : analysisView(d)}</div>`;
  paintSync();
  if (TAB === 'spend') wireChart(d);
  if (TAB === 'money') wireAnalysis(d);
  if (TAB === 'home') wireMoney(d);
}

// ───────── Home tab ─────────
function homeView(d) {
  const pct = d.budget ? Math.min(100, d.spent / d.budget * 100) : 0;
  const top = d.alerts[0];
  return `
    ${moneyChart(d)}${askCard(d)}${bankList(d)}
    ${top ? `<div class="alert ${top.level}" onclick="setTab('spend')"><b>${ICON[top.level]}</b><span>${esc(top.text)}${d.alerts.length > 1 ? ` <u>+${d.alerts.length - 1} more</u>` : ''}</span></div>` : ''}
    <div class="card" onclick="setTab('spend')">
      <div style="display:flex;justify-content:space-between"><span class="sub">Spent this month</span><span class="sub">${inr(Math.max(0, d.budget - d.spent))} left</span></div>
      <div class="big">${inr(d.spent)} <span class="sub" style="font-weight:400">of ${inr(d.budget)}</span></div>
      <div class="meter ${d.spent > d.budget ? 'over' : ''}"><div class="fill" style="width:${pct}%"></div><div class="pace" style="left:calc(${d.today / d.daysInMonth * 100}% - 1px)"></div></div>
    </div>
    <div class="two">
      <div class="card"><div class="sub">Today</div><div class="big">${inr(d.spentToday)}</div></div>
      <div class="card"><div class="sub">Safe / day</div><div class="big">${inr(d.safeToSpendPerDay)}</div></div>
    </div>
    <h1>Latest</h1>
    <div class="card">${(d.history || []).slice(-8).reverse().map(histRow).join('') || '<p class="note">Waiting for your first bank SMS…</p>'}</div>`;
}

// ───────── Spending tab (Apple-style) ─────────
// Stack order = the palette's validated slot order, so neighbouring colours always stay distinguishable.
const CATS = [
  ['Transport', 'var(--c1)'], ['Food & drinks', 'var(--c2)'], ['Online delivery', 'var(--c3)'], ['Local shops', 'var(--c4)'],
  ['Shopping', 'var(--c5)'], ['People', 'var(--c6)'], ['Bills & subscriptions', 'var(--c7)'], ['Health', 'var(--c8)'], ['Other', 'var(--c9)'],
];
const CAT_COLOR = Object.fromEntries(CATS);
const catOf = c => CAT_COLOR[c] ? c : 'Other';
let SP_ACCT = 'all', SP_PERIOD = 'month', SP_OFFSET = 0, SP_BAR = null, SP_CAT = null;
function setSP(k, v) {
  if (k === 'a') SP_ACCT = v; if (k === 'p') { SP_PERIOD = v; SP_OFFSET = 0; } if (k === 'o') SP_OFFSET = Math.min(0, SP_OFFSET + v);
  if (k === 'bar') SP_BAR = SP_BAR === v ? null : v; else if (k !== 'cat') SP_BAR = null;
  if (k === 'cat') SP_CAT = SP_CAT === v ? null : v; else if (k !== 'bar') SP_CAT = null;
  render();
}

// The period on screen, its buckets (bars) and the previous period to compare with
function spPeriod(off) {
  const now = new Date();
  if (SP_PERIOD === 'week') {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + 7 * off);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
    return { start, end, label: start.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' – ' + new Date(end - DAY).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      buckets: [...Array(7)].map((_, i) => { const d0 = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); return { s: +d0, e: +d0 + DAY, label: d0.toLocaleDateString('en-IN', { weekday: 'narrow' }), long: d0.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' }) }; }), unit: 'day' };
  }
  if (SP_PERIOD === 'year') {
    const y = now.getFullYear() + off, start = new Date(y, 0, 1), end = new Date(y + 1, 0, 1);
    return { start, end, label: String(y), unit: 'month',
      buckets: [...Array(12)].map((_, i) => ({ s: +new Date(y, i, 1), e: +new Date(y, i + 1, 1), label: new Date(y, i, 1).toLocaleDateString('en-IN', { month: 'narrow' }), long: new Date(y, i, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }) })) };
  }
  const start = new Date(now.getFullYear(), now.getMonth() + off, 1), end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  const n = Math.round((end - start) / DAY);
  return { start, end, label: start.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }), unit: 'day',
    buckets: [...Array(n)].map((_, i) => { const d0 = new Date(start.getFullYear(), start.getMonth(), i + 1); return { s: +d0, e: +d0 + DAY, label: (i + 1) % 7 === 1 ? String(i + 1) : '', long: d0.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) }; }) };
}
const spTx = (d, P) => (d.history || []).filter(t => !t[2] && t[0] >= +P.start && t[0] < +P.end && (SP_ACCT === 'all' || t[1] === SP_ACCT));
const byCat = tx => { const o = {}; tx.forEach(t => { const c = catOf(t[6]); o[c] = (o[c] || 0) + t[3]; }); return o; };
const pctTxt = (a, b) => b > 0 ? Math.round((a / b - 1) * 100) : null;

function spendView(d) {
  const P = spPeriod(SP_OFFSET), Q = spPeriod(SP_OFFSET - 1);
  const tx = spTx(d, P), prev = spTx(d, Q);
  const total = tx.reduce((s, t) => s + t[3], 0), prevTotal = prev.reduce((s, t) => s + t[3], 0);
  // compare like with like: for the current period, only the same number of days of the previous one
  const elapsed = Math.min(Date.now(), +P.end) - +P.start;
  const prevSoFar = SP_OFFSET === 0 ? prev.filter(t => t[0] - +Q.start <= elapsed).reduce((s, t) => s + t[3], 0) : prevTotal;
  const ch = pctTxt(total, prevSoFar);
  const cats = byCat(tx), catsPrev = byCat(SP_OFFSET === 0 ? prev.filter(t => t[0] - +Q.start <= elapsed) : prev);
  const list = CATS.map(c => c[0]).filter(c => cats[c]).sort((a, b) => cats[b] - cats[a]);
  const B = banks(d);
  const chip = (fn, k, v, label, on, color) => `<button class="${on ? 'on' : ''}" onclick="${fn}('${k}', ${typeof v === 'string' ? `'${v.replace(/'/g, "\\'")}'` : v})">${color ? `<span class="sw" style="background:${color}"></span>` : ''}${label}</button>`;
  const monthNow = SP_PERIOD === 'month' && SP_OFFSET === 0;
  return `
    ${B.length > 1 ? `<div class="chips">${chip('setSP', 'a', 'all', 'All banks', SP_ACCT === 'all')}${B.map(b => chip('setSP', 'a', b.name, esc(short(b.name)), SP_ACCT === b.name, b.color)).join('')}</div>` : ''}
    <div class="seg">${['week', 'month', 'year'].map(p => `<button class="${SP_PERIOD === p ? 'on' : ''}" onclick="setSP('p','${p}')">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div>
    <div class="pnav"><button onclick="setSP('o',-1)" aria-label="Previous">‹</button><span>${P.label}</span><button onclick="setSP('o',1)" ${SP_OFFSET === 0 ? 'disabled' : ''} aria-label="Next">›</button></div>
    <div class="card">
      <div class="sub">Spent</div>
      <div class="hero">${inr(total)}</div>
      ${ch !== null ? `<div class="delta ${ch > 0 ? 'up' : 'down'}">${ch > 0 ? '▲' : '▼'} ${Math.abs(ch)}% <span>vs ${SP_OFFSET === 0 ? 'same point ' : ''}last ${SP_PERIOD}</span></div>` : '<div class="sub">No earlier data to compare</div>'}
      <div class="chart" style="margin-top:14px"><div id="spChart"></div></div>
      <div id="spTip">${barDetail(d, P, tx)}</div>
    </div>
    ${monthNow && d.budget ? budgetCard(d) : ''}
    ${insights(tx, prev, cats, catsPrev, total, P)}
    <h1>Categories</h1>
    <div class="card">
      ${total ? `<div class="stack" style="height:12px;margin:4px 0 12px">${list.map(c => `<div style="flex:${cats[c]};background:${CAT_COLOR[c]}"></div>`).join('')}</div>` : ''}
      ${list.map(c => { const cp = pctTxt(cats[c], catsPrev[c] || 0), n = tx.filter(t => catOf(t[6]) === c).length;
        return `<div class="catrow" onclick="setSP('cat','${c}')">
          <span class="sw lg" style="background:${CAT_COLOR[c]}"></span>
          <div class="grow"><div>${esc(c)}</div><div class="sub">${n} payment${n === 1 ? '' : 's'} · ${cats[c] / total < .01 ? '<1' : Math.round(cats[c] / total * 100)}%${cp !== null && Math.abs(cp) >= 5 ? ` · <span class="${cp > 0 ? 'debit' : 'credit'}">${cp > 0 ? '▲' : '▼'}${Math.abs(cp)}%</span>` : ''}</div></div>
          <div class="amt">${inr(cats[c])}</div><span class="chev">${SP_CAT === c ? '⌃' : '›'}</span></div>
          ${SP_CAT === c ? `<div class="catlist">${tx.filter(t => catOf(t[6]) === c).slice().reverse().map(histRow).join('')}</div>` : ''}`; }).join('') || '<p class="note">No spending in this period.</p>'}
    </div>
    ${topPlaces(tx)}`;
}

function budgetCard(d) {
  const pct = Math.min(100, d.spent / d.budget * 100), pace = d.today / d.daysInMonth * 100;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between"><span class="sub">Monthly budget</span><span class="sub">${inr(Math.max(0, d.budget - d.spent))} left · ${inr(d.safeToSpendPerDay)}/day</span></div>
    <div class="meter ${d.spent > d.budget ? 'over' : ''}"><div class="fill" style="width:${pct}%"></div><div class="pace" style="left:calc(${pace}% - 1px)"></div></div>
    <div class="sub">${inr(d.spent)} of ${inr(d.budget)} · line = even pace for today</div>
    ${d.alerts.filter(a => a.level !== 'good').map(a => `<div class="alert ${a.level}" style="margin:10px 0 0"><b>${ICON[a.level]}</b><span>${esc(a.text)}</span></div>`).join('')}
  </div>`;
}

// Plain-language insights, only the ones that are actually true for this period
function insights(tx, prev, cats, catsPrev, total, P) {
  if (!tx.length) return '';
  const out = [];
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
  if (top) out.push([CAT_COLOR[top[0]], `<b>${esc(top[0])}</b> is your biggest spend: ${inr(top[1])}, ${Math.round(top[1] / total * 100)}% of the total.`]);
  const ups = Object.entries(cats).map(([c, v]) => [c, v, catsPrev[c] || 0]).filter(([, v, w]) => w > 0 && v - w >= 200 && v > w * 1.3).sort((a, b) => (b[1] - b[2]) - (a[1] - a[2]));
  if (ups[0]) out.push([CAT_COLOR[ups[0][0]], `<b>${esc(ups[0][0])}</b> is up ${Math.round((ups[0][1] / ups[0][2] - 1) * 100)}% (${inr(ups[0][1] - ups[0][2])} more than last ${SP_PERIOD}).`]);
  const freq = {}; tx.forEach(t => { if (t[4]) freq[t[4]] = (freq[t[4]] || []).concat(t[3]); });
  const f = Object.entries(freq).sort((a, b) => b[1].length - a[1].length)[0];
  if (f && f[1].length >= 3) out.push(['var(--muted)', `You paid <b>${esc(f[0])}</b> ${f[1].length} times, ${inr(f[1].reduce((a, b) => a + b, 0))} in total.`]);
  const del = cats['Online delivery'] || 0;
  if (del && del / total >= 0.15) out.push([CAT_COLOR['Online delivery'], `Delivery apps took <b>${Math.round(del / total * 100)}%</b> of your spending.`]);
  const big = tx.slice().sort((a, b) => b[3] - a[3])[0];
  if (big && big[3] >= total * 0.25 && tx.length > 3) out.push(['var(--muted)', `Your biggest single payment was <b>${inr(big[3])}</b> to ${esc(big[4] || catOf(big[6]))}.`]);
  if (SP_PERIOD !== 'year') {
    const we = tx.filter(t => [0, 6].includes(new Date(t[0]).getDay())), wd = tx.filter(t => ![0, 6].includes(new Date(t[0]).getDay()));
    const weAvg = we.reduce((s, t) => s + t[3], 0) / 2, wdAvg = wd.reduce((s, t) => s + t[3], 0) / 5;
    if (SP_PERIOD === 'week' && weAvg > wdAvg * 1.8 && weAvg > 300) out.push(['var(--muted)', `You spend about ${(weAvg / Math.max(1, wdAvg)).toFixed(1)}× more per day on weekends.`]);
  }
  return out.length ? `<h1>Insights</h1><div class="card">${out.slice(0, 4).map(([c, t]) => `<div class="insight"><span class="bar" style="background:${c}"></span><span>${t}</span></div>`).join('')}</div>` : '';
}

function topPlaces(tx) {
  const o = {}; tx.forEach(t => { const k = t[4] || catOf(t[6]); o[k] = o[k] || [0, 0, catOf(t[6])]; o[k][0] += t[3]; o[k][1]++; });
  const top = Object.entries(o).sort((a, b) => b[1][0] - a[1][0]).slice(0, 6);
  if (!top.length) return '';
  const max = top[0][1][0];
  return `<h1>Top places</h1><div class="card">${top.map(([n, [v, c, cat]]) => `<div class="place"><div class="top"><span>${esc(n)}</span><span class="amt">${inr(v)}</span></div>
    <div class="pbar"><div style="width:${v / max * 100}%;background:${CAT_COLOR[cat]}"></div></div><div class="sub">${esc(cat)} · ${c}×</div></div>`).join('')}</div>`;
}

function barDetail(d, P, tx) {
  if (SP_BAR === null) {
    const n = P.buckets.filter(b => b.s <= Date.now()).length || 1, total = tx.reduce((s, t) => s + t[3], 0);
    return `<div class="sub" style="margin-top:6px">Average ${inr(total / n)} per ${P.unit} · tap a bar for details</div>`;
  }
  const b = P.buckets[SP_BAR], bt = tx.filter(t => t[0] >= b.s && t[0] < b.e), c = byCat(bt);
  return `<div class="bardetail"><div class="top"><b>${b.long}</b><b>${inr(bt.reduce((s, t) => s + t[3], 0))}</b></div>
    ${Object.entries(c).sort((x, y) => y[1] - x[1]).map(([k, v]) => `<div class="mini"><span class="sw" style="background:${CAT_COLOR[k]}"></span><span class="grow">${esc(k)}</span><span class="amt">${inr(v)}</span></div>`).join('') || '<div class="sub">Nothing spent</div>'}
    ${P.unit === 'day' ? bt.slice().reverse().map(histRow).join('') : ''}</div>`;
}

function wireChart(d) {
  const P = spPeriod(SP_OFFSET), tx = spTx(d, P), el = document.getElementById('spChart'); if (!el) return;
  const W = el.clientWidth || 320, H = 180, pb = 18, pt = 16, n = P.buckets.length, gap = n > 12 ? 2 : 6;
  const bw = (W - 34 - gap * (n - 1)) / n;
  const data = P.buckets.map(b => { const bt = tx.filter(t => t[0] >= b.s && t[0] < b.e); const c = byCat(bt); return { c, total: bt.reduce((s, t) => s + t[3], 0) }; });
  const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); return Math.ceil(v / p / (v / p > 5 ? 2 : 1)) * p * (v / p > 5 ? 2 : 1); };
  const max = niceMax(Math.max(1, ...data.map(x => x.total)));
  const y = v => H - pb - v / max * (H - pb - pt);
  const past = P.buckets.filter(b => b.s <= Date.now()).length || 1, avg = data.reduce((s, x) => s + x.total, 0) / past;
  let g = [0, .5, 1].map(f => `<line x1="0" x2="${W - 34}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--grid)"/><text x="${W}" y="${y(max * f) + 3}" text-anchor="end">${inrK(max * f)}</text>`).join('');
  data.forEach((x, i) => {
    const bx = i * (bw + gap), dim = SP_BAR !== null && SP_BAR !== i ? .35 : 1, future = P.buckets[i].s > Date.now();
    let yy = H - pb; const order = CATS.map(c => c[0]).filter(c => x.c[c]);
    order.forEach((c, j) => {
      const h = x.c[c] / max * (H - pb - pt), top = j === order.length - 1, r = top ? Math.min(4, bw / 2, h) : 0, y0 = yy - h + (j ? 0 : 0);
      const hh = Math.max(0, h - (top ? 0 : 2));   // 2px surface gap between segments
      g += top ? `<path d="M${bx},${yy}V${yy - hh + r}q0,-${r} ${r},-${r}H${bx + bw - r}q${r},0 ${r},${r}V${yy}Z" fill="${CAT_COLOR[c]}" opacity="${dim}"/>`
               : `<rect x="${bx}" y="${yy - hh}" width="${bw}" height="${hh}" fill="${CAT_COLOR[c]}" opacity="${dim}"/>`;
      yy -= h;
    });
    if (!x.total && !future) g += `<rect x="${bx}" y="${H - pb - 2}" width="${bw}" height="2" rx="1" fill="var(--grid)"/>`;
    if (P.buckets[i].label) g += `<text x="${bx + bw / 2}" y="${H - 3}" text-anchor="middle" ${SP_BAR === i ? 'style="fill:var(--text);font-weight:600"' : ''}>${P.buckets[i].label}</text>`;
    g += `<rect x="${bx - gap / 2}" y="0" width="${bw + gap}" height="${H}" fill="transparent" style="cursor:pointer" onclick="setSP('bar', ${i})"/>`;
  });
  if (avg > 0) g += `<line x1="0" x2="${W - 34}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--text)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/><text x="2" y="${y(avg) - 4}" style="fill:var(--text)">avg ${inrK(avg)}</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Spending per ${P.unit} by category">${g}</svg>`;
}

// One transaction row in History/Spending. Tap it to change its category.
let SEEN_T = Number(store.get('seenT') || 0), NEW_SINCE = SEEN_T;
function histRow(t) {
  const m = t[4] || '';
  return `<div class="row ${NEW_SINCE && t[0] > NEW_SINCE ? 'new' : ''}" onclick="event.stopPropagation(); pickCat(${JSON.stringify(m).replace(/"/g, '&quot;')}, '${catOf(t[6])}')">
    <div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="sw" style="background:${t[2] ? 'var(--in)' : CAT_COLOR[catOf(t[6])]}"></span>
    <div style="min-width:0"><div class="ell">${esc(m || (t[2] ? 'Received' : 'Payment'))}</div><div class="sub">${t[2] ? 'Money in' : esc(catOf(t[6]))} · ${esc(short(t[1]))} · ${new Date(t[0]).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</div></div></div>
    <div class="amt ${t[2] ? 'credit' : 'debit'}">${t[2] ? '+' : '−'}${inr(t[3])}</div></div>`;
}

function pickCat(merchant, current) {
  if (!merchant) { toast('This payment has no name to learn from'); return; }
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.innerHTML = `<div class="sheet-bg" onclick="this.parentNode.remove()"></div><div class="sheet-card">
    <div class="sub" style="text-align:center">Always put</div><div style="text-align:center;font-weight:600;margin:2px 0 10px">${esc(merchant)}</div>
    ${CATS.map(([c, col]) => `<button class="catpick ${c === current ? 'on' : ''}" data-c="${esc(c)}"><span class="sw lg" style="background:${col}"></span>${esc(c)}${c === current ? '' : ''}</button>`).join('')}
    <button class="catpick" onclick="this.closest('.sheet').remove()" style="justify-content:center;color:var(--muted)">Cancel</button></div>`;
  sheet.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    sheet.remove(); toast('Saving…');
    api('setCategory', { merchant, category: b.dataset.c }).then(r => { toast(r.ok ? 'Got it Future payments too' : (r.error || 'Couldn’t save')); if (r.ok) sync(); }).catch(() => toast('No connection'));
  });
  document.body.appendChild(sheet);
}

// ───────── Accounts tab ─────────
function txRow(t) {
  return `<div class="row"><div>${esc(t.merchant || (t.type === 'credit' ? 'Received' : 'Payment'))}<div class="sub">${esc(t.category)} · ${esc(t.account)} · ${ago(t.when)}</div></div><div class="amt ${t.type}">${t.type === 'credit' ? '+' : '−'}${inr(t.amount)}</div></div>`;
}

// ───────── Banks (found automatically from your messages) ─────────
const DAY = 86400000;
function banks(d) {
  // One entry per bank account seen in your messages. Order and colour are fixed by name, so a bank keeps its colour.
  const list = d.accounts.filter(a => a.kind === 'bank').map(a => a.name).sort();
  return list.map((name, i) => {
    const a = d.accounts.find(x => x.name === name);
    const at = a.balanceAt || a.updated;   // when the balance itself was last reported
    return { name, color: `var(--s${(i % 5) + 1})`, balance: a.balance, updated: at, estimated: a.estimated, manual: a.manual,
             stale: !!at && Date.now() - new Date(at) > 45 * DAY };
  });
}
const short = n => n.replace(/ A\/c /, ' ');

    <div class="card">${(() => { const st = d.status || {}, H = 3600000;
      const sms = st.lastSms ? Date.now() - new Date(st.lastSms) : null, gm = st.lastScan ? Date.now() - new Date(st.lastScan) : null;
      const row = (ok, name, text) => `<div class="conn"><span class="dot" style="background:${ok ? 'var(--good)' : 'var(--warn)'}"></span><div class="grow"><div>${name}</div><div class="sub">${text}</div></div></div>`;
      return row(sms !== null && sms < 7 * 24 * H, 'Bank SMS (iPhone Shortcut)', st.lastSms ? 'last text received ' + ago(st.lastSms) + (st.lastSmsResult ? ' · ' + st.lastSmsResult : '') : 'nothing received yet — check the Shortcuts automation') +
             row(gm !== null && gm < H, 'Bank emails (Gmail)', st.lastScan ? 'last checked ' + ago(st.lastScan) : 'not checked yet') +
             row(true, 'This app', 'synced ' + (SYNCED ? ago(new Date(SYNCED).toISOString()) : 'never') + ' · pull down anywhere to refresh'); })()}</div>
    <h1>Bank balances</h1>
    <div class="card">
      ${(d.accounts || []).filter(a => a.kind === 'bank').map(a => `<div class="field"><span>${esc(a.name.replace(/ A\/c /, ' '))}</span>
        <input data-bal="${esc(a.name)}" type="text" inputmode="text" autocomplete="off" placeholder="${a.balance === null ? 'unknown' : a.balance}"></div>`).join('') || '<p class="note">No banks yet.</p>'}
    </div>
    <p class="note">If a bank's balance looks wrong (for example your bank doesn't send it), type what your bank app shows, with a minus sign if it's negative. After that, every payment in or out updates it automatically.</p>
    <h1>Limits per category</h1>
    <div class="card">
      ${cats.map((c, i) => `<div class="field"><span>${esc(c)}</span><input data-cat="${esc(c)}" type="number" inputmode="numeric" min="0" step="100" value="${S.categoryBudgets[c] || ''}" placeholder="no limit"></div>`).join('')}
    </div>
    <p class="note">Leave a category empty for no limit.</p>
    <h1>Change PIN</h1>
    <div class="card">
      <div class="field"><span>New PIN</span><input id="s_pin" type="password" inputmode="numeric" placeholder="unchanged"></div>
      <div class="field"><span>New PIN again</span><input id="s_pin2" type="password" inputmode="numeric" placeholder="unchanged"></div>
    </div>
    <button id="s_save" onclick="saveSettings()">Save</button>
    <p class="note" id="s_msg"></p>
    <h1>Add an old SMS</h1>
    <div class="card">
      <textarea id="manual" rows="3" placeholder="Paste a bank SMS here"></textarea>
      <button onclick="addManual()">Add</button>
      <p class="note" id="manualMsg"></p>
    </div>
    <button onclick="signOut()" style="background:var(--card);color:var(--crit)">Lock app on this phone</button>`;
}

function saveSettings() {
  const newPin = document.getElementById('s_pin').value.trim();
  const msg = document.getElementById('s_msg');
  if (newPin && !/^\d{4,8}$/.test(newPin)) { msg.textContent = 'PIN must be 4 to 8 digits.'; return; }
  if (newPin !== document.getElementById('s_pin2').value.trim()) { msg.textContent = 'The two new PINs don’t match.'; return; }
  const categoryBudgets = {};
  document.querySelectorAll('input[data-cat]').forEach(i => { if (Number(i.value) > 0) categoryBudgets[i.dataset.cat] = Number(i.value); });
  const setBalances = {};
  document.querySelectorAll('input[data-bal]').forEach(i => { const v = i.value.trim().replace(/[₹,\s]/g, '').replace('−', '-'); if (v !== '' && isFinite(Number(v))) setBalances[i.dataset.bal] = Number(v); });
  const settings = {
    setBalances,
    budget: Number(document.getElementById('s_budget').value) || 0,
    bigPayment: Number(document.getElementById('s_big').value) || 0,
    emailAlerts: document.getElementById('s_email').checked,
    categoryBudgets, newPin: newPin || undefined,
  };
  const btn = document.getElementById('s_save'); btn.disabled = true; btn.textContent = 'Saving…';
  api('saveSettings', { settings }).then(r => {
    btn.disabled = false; btn.textContent = 'Save';
    if (!r.ok) { msg.textContent = r.error || 'Couldn’t save'; return; }
    if (newPin) { PIN = newPin; store.set('pin', PIN); }
    toast('Saved'); sync();
  }).catch(e => { btn.disabled = false; btn.textContent = 'Save'; msg.textContent = 'No connection. Try again.'; });
}

function signOut() {
  store.set('pin', ''); store.set('data', ''); PIN = ''; DATA = null; showLock('');
}

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

function addManual() {
  const text = document.getElementById('manual').value.trim();
  if (!text) return;
  api('add', { text }).then(r => {
    r = r.result || r;
    document.getElementById('manualMsg').textContent = { added:'Added', duplicate:'Already had that one', skipped:'Not a transaction (OTP/notice)', unparsed:"Couldn't read it. Saved to Unparsed" }[r] || r;
    if (r === 'added') setTimeout(sync, 600);
  });
}

// ── Pull down to refresh ──
(() => { let y0 = null, dy = 0; const ptr = document.getElementById('ptr');
  addEventListener('touchstart', e => { y0 = scrollY <= 0 && !document.querySelector('.sheet') ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; ptr.classList.toggle('show', dy > 70); ptr.textContent = dy > 70 ? 'Release to refresh' : ''; }, { passive: true });
  addEventListener('touchend', () => { if (y0 !== null && dy > 70) { ptr.textContent = 'Refreshing…'; WANT_REFRESH = true; sync(); setTimeout(() => ptr.classList.remove('show'), 1200); } else ptr.classList.remove('show'); y0 = null; });
})();

// ── Auto-sync: on open, whenever you come back to the app, and every minute while it's open ──
if (DATA) render();
if (PIN && (IN_GOOGLE || URL_)) sync(); else { if (!DATA) showLock(); if (IN_GOOGLE || URL_) sync(true); }
// New version published? Reload once so the phone never runs an old copy.
function checkUpdate() {
  if (IN_GOOGLE || BUILD.startsWith('__')) return;
  fetch('version.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = v.trim(); if (v && v !== BUILD && store.get('reloadedFor') !== v) { store.set('reloadedFor', v); location.reload(); }
  }).catch(() => {});
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.hidden) return; checkUpdate(); WANT_REFRESH = true; sync();
  const p = Number(store.get('askPending') || 0);   // just came back from Ask Money: fetch the answer as soon as it lands
  if (p && Date.now() - p < 5 * 60000) { store.set('askPending', ''); [4000, 9000, 16000].forEach(ms => setTimeout(() => sync(), ms)); } });

setInterval(() => { if (!document.hidden) sync(); }, 120000);
setInterval(paintSync, 30000);
if ('serviceWorker' in navigator && !IN_GOOGLE && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
