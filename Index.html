<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f6fed">
<base target="_top">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<style>
  :root {
    --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --track:#ececf0;
    --bar:#2f6fed; --bar-soft:#b9cdf8; --ref:#8e8e93;
    --green:#1a7f37; --red:#c62828;
    --good-bg:#e7f5ec; --good:#1a7f37; --warn-bg:#fff4e0; --warn:#9a5b00; --crit-bg:#fdecec; --crit:#b3261e; --info-bg:#eef3ff; --info:#2451b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:#2c2c2e; --track:#2c2c2e;
      --bar:#5b8ff9; --bar-soft:#2d3f66; --ref:#8e8e93;
      --green:#4cd964; --red:#ff6b6b;
      --good-bg:#10261a; --good:#5fd38a; --warn-bg:#2b2010; --warn:#f5b449; --crit-bg:#2d1413; --crit:#ff8a80; --info-bg:#131d33; --info:#8fb0ff;
    }
  }
  :root { --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --in:#1baf7a; --out:#eb6834; --grid:#e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --in:#199e70; --out:#d95926; --grid:#2c2c2e; } }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
  .chips button { width:auto; margin:0; padding:7px 12px; border-radius:18px; background:var(--card); color:var(--text); font-size:14px; font-weight:500; white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .chips button.on { background:var(--text); color:var(--bg); }
  .sw { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .stack { display:flex; gap:2px; height:10px; border-radius:5px; overflow:hidden; margin:12px 0 4px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:6px; }
  .legend span { display:flex; gap:6px; align-items:center; }
  .chart svg { display:block; overflow:visible; }
  .chart .tip { font-size:14px; min-height:40px; margin-top:6px; }
  .month { cursor:pointer; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0 auto; background:var(--bg); color:var(--text); font:16px -apple-system, system-ui, sans-serif; max-width:560px;
         padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 90px); -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  header { display:flex; justify-content:space-between; align-items:center; padding:8px 0 4px; }
  header .title { font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .sync { font-size:12px; color:var(--muted); background:var(--card); border-radius:20px; padding:6px 10px; border:0; width:auto; margin:0; display:flex; gap:6px; align-items:center; font-weight:500; }
  .sync .dot { width:7px; height:7px; border-radius:50%; background:var(--good); }
  .sync.busy .dot { background:var(--bar); animation:pulse 1s infinite; }
  .sync.stale .dot { background:var(--warn); }
  @keyframes pulse { 50% { opacity:.25; } }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:color-mix(in srgb, var(--card) 88%, transparent);
        -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; max-width:180px; background:none; color:var(--muted); margin:0; padding:8px 0 6px; font-size:11px; font-weight:500; border-radius:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button svg { width:26px; height:26px; }
  nav button.on { color:var(--bar); }
  nav[hidden], [hidden] { display:none !important; }
  .view { animation:fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } }
  h1 { font-size:13px; font-weight:600; color:var(--muted); margin:20px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .sub { font-size:13px; color:var(--muted); }
  .amt { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .debit { color:var(--red); } .credit { color:var(--green); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .two .card { margin:0; }
  .big { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .hero { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .alert { display:flex; gap:10px; border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:15px; line-height:1.35; }
  .alert b { white-space:nowrap; }
  .alert.critical { background:var(--crit-bg); color:var(--crit); }
  .alert.warning { background:var(--warn-bg); color:var(--warn); }
  .alert.good { background:var(--good-bg); color:var(--good); }
  .alert.info { background:var(--info-bg); color:var(--info); }
  .meter { position:relative; height:12px; background:var(--track); border-radius:6px; margin:10px 0 6px; overflow:visible; }
  .meter .fill { position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--bar); }
  .meter .pace { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--text); border-radius:1px; }
  .meter.over .fill { background:var(--crit); }
  .cat { padding:8px 0; }
  .cat .top { display:flex; justify-content:space-between; font-size:15px; }
  .cat .meter { height:8px; margin:6px 0 2px; }
  .cat .meter .last { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ref); }
  svg text { fill:var(--muted); font-size:10px; }
  #tip { font-size:14px; min-height:20px; margin-top:4px; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  input, textarea, button { font:inherit; width:100%; border-radius:10px; border:1px solid var(--line); padding:12px; background:var(--card); color:var(--text); }
  button { background:var(--bar); color:#fff; border:0; font-weight:600; margin-top:8px; cursor:pointer; }
  .field { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:0; }
  .field input { width:130px; text-align:right; padding:8px 10px; }
  .field input[type=checkbox] { width:24px; height:24px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 76px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:14px; z-index:9; }
  .note { font-size:13px; color:var(--muted); margin:8px 0; }
  #lock { max-width:320px; margin:20vh auto 0; text-align:center; }
</style>
</head>
<body>
<div id="lock">
  <div style="font-size:56px">💸</div>
  <h1>Money</h1>
  <input id="url" type="url" placeholder="Paste your Web app URL (…/exec)" style="margin-bottom:8px">
  <p class="note" id="lockMsg"></p>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
  <input id="pin2" type="password" inputmode="numeric" placeholder="Type the new PIN again" style="margin-top:8px" hidden>
  <button onclick="unlock()">Open</button>
  <p class="note" id="err"></p>
</div>
<div id="app" hidden></div>
<nav id="nav" hidden>
  <button data-t="home" onclick="setTab('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-t="spend" onclick="setTab('spend')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Spending</button>
  <button data-t="money" onclick="setTab('money')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>History</button>
  <button data-t="settings" onclick="setTab('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<script>
// Exact amounts: ₹1,234.50 keeps its paise, ₹1,234 stays clean.
const inr = n => { const v = Math.round(Number(n || 0) * 100) / 100;
  return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const ago = iso => { const m = (Date.now() - new Date(iso)) / 60000; return m < 60 ? Math.max(1, Math.round(m)) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short' }); };
const ICON = { critical:'⛔ Over', warning:'⚠️ Watch', good:'✅ OK', info:'ℹ️ Note' };
// Runs two ways: inside Google's page (google.script.run) or as a stand-alone Home Screen app (fetch).
const IN_GOOGLE = !!(window.google && google.script && google.script.run);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
// Your server. Built in so you never have to paste it.
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbx_89qVHduJzbO_V24J36aoPk6fkId-RgIDZ4agAk3h33-DLOeyvNLFz7gaWoz5fZM_/exec';
let PIN = store.get('pin') || '', URL_ = store.get('url') || DEFAULT_URL, TAB = store.get('tab') || 'home';
let DATA = null, SYNCED = Number(store.get('synced') || 0), BUSY = false;
try { DATA = JSON.parse(store.get('data') || 'null'); } catch (e) {}
if (IN_GOOGLE || URL_) document.getElementById('url').hidden = true; else document.getElementById('url').value = URL_;

function api(action, extra) {
  if (IN_GOOGLE) return new Promise((ok, bad) => {
    const r = google.script.run.withFailureHandler(bad);
    if (action === 'summary') r.withSuccessHandler(ok).getSummary(PIN);
    else if (action === 'createPin') r.withSuccessHandler(ok).createPin(extra.newPin);
    else if (action === 'saveSettings') r.withSuccessHandler(ok).saveSettings(PIN, extra.settings);
    else r.withSuccessHandler(x => ok({ ok: true, result: x })).addManual(PIN, extra.text);
  });
  // text/plain keeps it a "simple" request, so Apps Script answers without a CORS preflight
  // Google sometimes answers with a random "not found" page, so try up to 4 times.
  const body = JSON.stringify(Object.assign({ action, pin: PIN }, extra || {}));
  const attempt = n => fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })
    .then(r => r.text()).then(t => JSON.parse(t))
    .catch(e => { if (n >= 3) throw e; return new Promise(ok => setTimeout(ok, 700 * (n + 1))).then(() => attempt(n + 1)); });
  return attempt(0);
}

let CREATING = false;
function unlock() {
  PIN = document.getElementById('pin').value.trim();
  document.getElementById('err').textContent = CREATING ? '' : 'Opening…';
  if (CREATING) {
    if (!/^\d{4,8}$/.test(PIN)) { document.getElementById('err').textContent = 'Use 4 to 8 digits.'; return; }
    if (PIN !== document.getElementById('pin2').value.trim()) { document.getElementById('err').textContent = 'The two PINs don’t match.'; return; }
    document.getElementById('err').textContent = 'Setting up…';
    api('createPin', { newPin: PIN }).then(r => {
      // "already set" can happen if an earlier try got through; just try opening with it
      if (!r.ok && r.error !== 'PIN already set') { document.getElementById('err').textContent = r.error; return; }
      CREATING = false; document.getElementById('pin2').hidden = true; sync(true);
    }).catch(() => { document.getElementById('err').textContent = 'No connection. Tap Open again.'; });
    return;
  }
  const typed = document.getElementById('url').value.trim();
  if (!IN_GOOGLE && typed) URL_ = typed;
  if (!URL_) URL_ = DEFAULT_URL;
  if (!IN_GOOGLE && !/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_)) { document.getElementById('err').textContent = 'That doesn’t look like your Web app URL (it ends in /exec).'; return; }
  sync(true);
}

function sync(fromLock) {
  if (BUSY || (!PIN && !fromLock)) return;
  BUSY = true; paintSync();
  api('summary').then(d => {
    BUSY = false;
    if (d && d.needsPin) { showCreatePin(); paintSync(); return; }
    if (!d || !d.ok) { if (fromLock === true || !DATA) showLock(PIN ? 'Wrong PIN' : ''); paintSync(); return; }
    DATA = d; SYNCED = Date.now();
    store.set('pin', PIN); store.set('url', URL_); store.set('data', JSON.stringify(d)); store.set('synced', String(SYNCED));
    render();
  }).catch(e => {
    BUSY = false; paintSync();
    if (!DATA) showLock('Couldn’t connect. Check the URL and your internet. (' + (e.message || e) + ')');
  });
}

function showCreatePin() {
  CREATING = true;
  showLock('');
  document.getElementById('lockMsg').textContent = 'Welcome! Create a PIN to protect your money info.';
  document.getElementById('pin').placeholder = 'New PIN (4–8 digits)';
  document.getElementById('pin2').hidden = false;
}

function showLock(msg) {
  document.getElementById('lock').hidden = false; document.getElementById('app').hidden = true; document.getElementById('nav').hidden = true;
  document.getElementById('err').textContent = msg || '';
}

function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const mins = (Date.now() - SYNCED) / 60000;
  el.className = 'sync' + (BUSY ? ' busy' : mins > 15 ? ' stale' : '');
  el.querySelector('span:last-child').textContent = BUSY ? 'Syncing…' : SYNCED ? 'Synced ' + (mins < 1 ? 'just now' : ago(new Date(SYNCED).toISOString())) : 'Not synced';
}

function setTab(t) { TAB = t; store.set('tab', t); render(); window.scrollTo(0, 0); }

function render() {
  const d = DATA;
  if (!d) return;
  document.getElementById('lock').hidden = true;
  const app = document.getElementById('app'), nav = document.getElementById('nav');
  app.hidden = false; nav.hidden = false;
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  const title = { home: 'Money', spend: 'This month', money: 'History', settings: 'Settings' }[TAB];
  app.innerHTML = `
    <header><div class="title">${title}</div><button id="sync" class="sync" onclick="sync()"><span class="dot"></span><span></span></button></header>
    <div class="view">${TAB === 'home' ? homeView(d) : TAB === 'spend' ? spendView(d) : TAB === 'settings' ? settingsView(d) : moneyView(d)}</div>`;
  paintSync();
  if (TAB === 'spend') wireChart(d);
  if (TAB === 'money') wireHistory(d);
}

// ───────── Home tab ─────────
function homeView(d) {
  const pct = d.budget ? Math.min(100, d.spent / d.budget * 100) : 0;
  const top = d.alerts[0];
  return `
    ${bankCard(d)}
    ${top ? `<div class="alert ${top.level}" onclick="setTab('spend')"><b>${ICON[top.level]}</b><span>${esc(top.text)}${d.alerts.length > 1 ? ` <u>+${d.alerts.length - 1} more</u>` : ''}</span></div>` : ''}
    <div class="card" onclick="setTab('spend')">
      <div style="display:flex;justify-content:space-between"><span class="sub">Spent this month</span><span class="sub">${inr(Math.max(0, d.budget - d.spent))} left</span></div>
      <div class="big">${inr(d.spent)} <span class="sub" style="font-weight:400">of ${inr(d.budget)}</span></div>
      <div class="meter ${d.spent > d.budget ? 'over' : ''}"><div class="fill" style="width:${pct}%"></div><div class="pace" style="left:calc(${d.today / d.daysInMonth * 100}% - 1px)"></div></div>
    </div>
    <div class="two">
      <div class="card"><div class="sub">Today</div><div class="big">${inr(d.spentToday)}</div></div>
      <div class="card"><div class="sub">Safe / day</div><div class="big">${inr(d.safeToSpendPerDay)}</div></div>
    </div>
    <h1>Latest</h1>
    <div class="card">${d.recent.slice(0, 8).map(txRow).join('') || '<p class="note">Waiting for your first bank SMS…</p>'}</div>`;
}

// ───────── Spending tab ─────────
function spendView(d) {
  const pct = d.budget ? Math.min(100, d.spent / d.budget * 100) : 0;
  const pacePct = d.today / d.daysInMonth * 100;          // where you "should" be today
  const over = d.spent > d.budget;
  const diffLast = d.spent - d.lastMonthSoFar;
  const catMax = Math.max(1, ...d.categories.map(c => Math.max(c.value, c.last, c.limit || 0)));

  return `
    ${d.alerts.map(a => `<div class="alert ${a.level}"><b>${ICON[a.level]}</b><span>${esc(a.text)}</span></div>`).join('')}

    <div class="card">
      <div class="sub">Spent this month</div>
      <div class="hero">${inr(d.spent)} <span class="sub" style="font-size:16px;font-weight:400">of ${inr(d.budget)}</span></div>
      <div class="meter ${over ? 'over' : ''}" role="img" aria-label="${Math.round(pct)}% of budget used, ${Math.round(pacePct)}% of month gone">
        <div class="fill" style="width:${pct}%"></div>
        <div class="pace" style="left:calc(${pacePct}% - 1px)"></div>
      </div>
      <div class="sub">The thin line = where you'd be if you spent evenly (day ${d.today} of ${d.daysInMonth})</div>
    </div>

    <div class="two">
      <div class="card"><div class="sub">Safe to spend / day</div><div class="big">${inr(d.safeToSpendPerDay)}</div></div>
      <div class="card"><div class="sub">Month-end at this pace</div><div class="big" style="color:${d.projected > d.budget ? 'var(--crit)' : 'var(--text)'}">${inr(d.projected)}</div></div>
      <div class="card"><div class="sub">Today</div><div class="big">${inr(d.spentToday)}</div><div class="sub">usual ${inr(d.usualPerDay)}/day</div></div>
      <div class="card"><div class="sub">vs last month (same date)</div><div class="big" style="color:${diffLast > 0 ? 'var(--crit)' : 'var(--good)'}">${diffLast > 0 ? '+' : '−'}${inr(Math.abs(diffLast))}</div><div class="sub">${d.lastMonthSoFar ? 'was ' + inr(d.lastMonthSoFar) : 'no data yet'}</div></div>
    </div>

    <h1>Spending per day</h1>
    <div class="card">
      <div id="chart"></div>
      <div id="tip" class="sub">Tap a bar to see that day</div>
    </div>

    <h1>Where it went</h1>
    <div class="card">
      ${d.categories.map(c => `
        <div class="cat">
          <div class="top"><span>${esc(c.name)}</span><span class="amt">${inr(c.value)}${c.limit ? ` <span class="sub">/ ${inr(c.limit)}</span>` : ''}</span></div>
          <div class="meter ${c.limit && c.value > c.limit ? 'over' : ''}">
            <div class="fill" style="width:${c.value / catMax * 100}%"></div>
            ${c.last ? `<div class="last" style="left:calc(${c.last / catMax * 100}% - 1px)" title="Last month by now: ${inr(c.last)}"></div>` : ''}
          </div>
          <div class="sub">${c.last ? `last month by now ${inr(c.last)} (grey line)` : ''}</div>
        </div>`).join('') || '<p class="note">No spending yet this month.</p>'}
    </div>

    <h1>Top places</h1>
    <div class="card">${d.merchants.map(m => `<div class="row"><div>${esc(m.name)}</div><div class="amt">${inr(m.value)}</div></div>`).join('') || '<p class="note">Nothing yet.</p>'}</div>

    <h1>Recent</h1>
    <div class="card">${d.recent.slice(0, 15).map(txRow).join('') || '<p class="note">Nothing yet.</p>'}</div>`;
}

function wireChart(d) {
  const el = document.getElementById('chart');
  const W = el.clientWidth || 320, H = 150, padL = 4, padB = 18, padT = 10;
  const n = d.daysInMonth, gap = 2;
  const bw = (W - padL) / n - gap;
  const perDay = d.budget / n;
  const max = Math.max(perDay * 1.5, ...d.daily, 1);
  const y = v => H - padB - (v / max) * (H - padB - padT);
  let bars = '', hits = '';
  d.daily.forEach((v, i) => {
    const x = padL + i * (bw + gap);
    const future = i + 1 > d.today;
    if (v > 0) {
      const top = y(v), h = H - padB - top, r = Math.min(4, bw / 2, h);
      // rounded top only, square at the baseline
      bars += `<path d="M${x},${H - padB} V${top + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${H - padB} Z" fill="${v > perDay * 2 ? 'var(--crit)' : 'var(--bar)'}"/>`;
    }
    hits += `<rect x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if (!future && (i === 0 || (i + 1) % 5 === 0)) bars += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${i + 1}</text>`;
  });
  const ly = y(perDay);
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Daily spending this month">
    <line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)"/>
    <line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--ref)" stroke-dasharray="4 4"/>
    <text x="4" y="${ly - 4}" text-anchor="start">budget/day ${inr(perDay)}</text>
    ${bars}${hits}</svg>`;
  const tip = document.getElementById('tip');
  el.querySelectorAll('rect[data-i]').forEach(r => {
    const show = () => {
      const i = Number(r.dataset.i), v = d.daily[i];
      tip.innerHTML = `<b>Day ${i + 1}</b>: ${v ? inr(v) + (v > perDay * 2 ? ' · way above your ' + inr(perDay) + '/day' : '') : 'nothing spent'}`;
    };
    r.addEventListener('mouseenter', show); r.addEventListener('click', show);
  });
}

// ───────── Accounts tab ─────────
function txRow(t) {
  return `<div class="row"><div>${esc(t.merchant || (t.type === 'credit' ? 'Received' : 'Payment'))}<div class="sub">${esc(t.category)} · ${esc(t.account)} · ${ago(t.when)}</div></div><div class="amt ${t.type}">${t.type === 'credit' ? '+' : '−'}${inr(t.amount)}</div></div>`;
}

// ───────── Banks (found automatically from your messages) ─────────
const DAY = 86400000;
function banks(d) {
  // One entry per bank account seen in your messages. Order and colour are fixed by name, so a bank keeps its colour.
  const list = d.accounts.filter(a => a.kind === 'bank').map(a => a.name).sort();
  return list.map((name, i) => {
    const a = d.accounts.find(x => x.name === name);
    const at = a.balanceAt || a.updated;   // when the balance itself was last reported
    return { name, color: `var(--s${(i % 5) + 1})`, balance: a.balance, updated: at, estimated: a.estimated, manual: a.manual,
             stale: !!at && Date.now() - new Date(at) > 45 * DAY };
  });
}
const short = n => n.replace(/ A\/c /, ' ');
const inrK = v => { const a = Math.abs(v); return (v < 0 ? '−' : '') + '₹' + (a >= 1e5 ? (a / 1e5).toFixed(a >= 1e6 ? 0 : 1) + 'L' : a >= 1000 ? (a / 1000).toFixed(a >= 1e4 ? 0 : 1) + 'k' : Math.round(a)); };

function bankCard(d) {
  // Only balances from the last 45 days count. An old balance (e.g. a year-old HDFC message) would make the total wrong.
  const all = banks(d).filter(b => b.balance !== null);
  const B = all.filter(b => !b.stale), old = all.filter(b => b.stale);
  const total = B.reduce((s, b) => s + b.balance, 0);
  if (!all.length) return `<div class="card"><div class="sub">Money in bank</div><div class="hero">—</div><div class="sub">Waiting for a message that shows your balance</div></div>`;
  return `<div class="card" onclick="setTab('money')">
    <div class="sub">Money in bank</div><div class="hero ${total < 0 ? 'debit' : ''}">${total < 0 ? '−' + inr(-total) : inr(total)}</div>
    ${B.filter(b => b.balance > 0).length > 1 ? `<div class="stack">${B.filter(b => b.balance > 0).map(b => `<div style="flex:${b.balance};background:${b.color}"></div>`).join('')}</div>` : ''}
    ${B.map(b => `<div class="row"><div style="display:flex;gap:10px;align-items:center"><span class="sw" style="background:${b.color}"></span><div>${esc(short(b.name))}
      <div class="sub">${b.manual ? 'you set it ' + ago(b.updated) : 'bank said ' + ago(b.updated)}${b.estimated ? ' · + payments since' : ''}</div></div></div>
      <div class="amt ${b.balance < 0 ? 'debit' : ''}">${b.balance < 0 ? '−' + inr(-b.balance) : inr(b.balance)}</div></div>`).join('')}
    ${old.map(b => `<div class="row" style="opacity:.5"><div style="display:flex;gap:10px;align-items:center"><span class="sw" style="background:${b.color}"></span><div>${esc(short(b.name))}
      <div class="sub">bank last said this in ${new Date(b.updated).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' })} · not counted · <u onclick="event.stopPropagation();setTab('settings')">set it</u></div></div></div>
      <div class="amt">${inr(b.balance)}</div></div>`).join('')}
  </div>`;
}

// ───────── History tab ─────────
let H_ACCT = 'all', H_RANGE = 36, H_MONTH = null;
function hFilter(d) {
  const from = Date.now() - H_RANGE * 30.4 * DAY;
  return (d.history || []).filter(t => t[0] >= from && (H_ACCT === 'all' || t[1] === H_ACCT));
}
function setH(k, v) { if (k === 'a') H_ACCT = v; if (k === 'r') H_RANGE = v; if (k === 'm') H_MONTH = v; if (k !== 'm') H_MONTH = null; render(); }

function moneyView(d) {
  const B = banks(d);
  const tx = hFilter(d);
  const out = tx.filter(t => !t[2]).reduce((s, t) => s + t[3], 0), inn = tx.filter(t => t[2]).reduce((s, t) => s + t[3], 0);
  const chip = (k, v, label, on, color) => `<button class="${on ? 'on' : ''}" onclick="setH('${k}', ${typeof v === 'string' ? `'${v}'` : v})">${color ? `<span class="sw" style="background:${color}"></span>` : ''}${label}</button>`;
  return `
    <div class="chips">${chip('a', 'all', 'All banks', H_ACCT === 'all')}${B.map(b => chip('a', b.name, esc(short(b.name)), H_ACCT === b.name, b.color)).join('')}</div>
    <div class="chips">${[[3, '3 months'], [12, '1 year'], [36, '3 years']].map(([v, l]) => chip('r', v, l, H_RANGE === v)).join('')}</div>
    <div class="two">
      <div class="card"><div class="sub">Money in</div><div class="big credit">${inr(inn)}</div></div>
      <div class="card"><div class="sub">Money out</div><div class="big debit">${inr(out)}</div></div>
    </div>
    <h1>How much money you had</h1>
    <div class="card chart"><div id="balChart"></div><div class="legend" id="balLegend"></div><div class="tip sub" id="balTip">Tap the chart to see a date</div></div>
    <h1>In and out each month</h1>
    <div class="card chart"><div id="monChart"></div>
      <div class="legend"><span><span class="sw" style="background:var(--in)"></span>Money in</span><span><span class="sw" style="background:var(--out)"></span>Money out</span></div>
      <div class="tip sub">Tap a month for details</div></div>
    <div id="monthDetail">${monthDetail(d, tx)}</div>
    ${d.unparsed ? `<p class="note">⚠️ ${d.unparsed} message(s) couldn't be read. See the “Unparsed” tab in the Sheet.</p>` : ''}`;
}

function monthKey(t) { const x = new Date(t); return x.getFullYear() * 12 + x.getMonth(); }
function monthName(k, long) { return new Date(Math.floor(k / 12), k % 12, 1).toLocaleDateString('en-IN', long ? { month: 'long', year: 'numeric' } : { month: 'short' }); }

function monthDetail(d, tx) {
  const k = H_MONTH !== null ? H_MONTH : (tx.length ? monthKey(tx[tx.length - 1][0]) : null);
  if (k === null) return '<p class="note">No transactions in this range yet.</p>';
  const m = tx.filter(t => monthKey(t[0]) === k);
  const out = m.filter(t => !t[2]), inn = m.filter(t => t[2]);
  const sum = a => a.reduce((s, t) => s + t[3], 0);
  const group = (a, i) => Object.entries(a.reduce((o, t) => (o[t[i] || 'Other'] = (o[t[i] || 'Other'] || 0) + t[3], o), {})).sort((x, y) => y[1] - x[1]);
  const cats = group(out, 6), places = group(out, 4).slice(0, 5);
  const max = Math.max(1, ...cats.map(c => c[1]));
  return `
    <h1>${monthName(k, true)}</h1>
    <div class="card">
      <div class="row"><span>Money in</span><span class="amt credit">+${inr(sum(inn))}</span></div>
      <div class="row"><span>Money out</span><span class="amt debit">−${inr(sum(out))}</span></div>
      <div class="row"><span>Net</span><span class="amt">${sum(inn) - sum(out) >= 0 ? '+' : '−'}${inr(Math.abs(sum(inn) - sum(out)))}</span></div>
    </div>
    ${cats.length ? `<div class="card">${cats.map(([c, v]) => `<div class="cat"><div class="top"><span>${esc(c)}</span><span class="amt">${inr(v)}</span></div>
      <div class="meter"><div class="fill" style="width:${v / max * 100}%"></div></div></div>`).join('')}</div>` : ''}
    ${places.length ? `<h1>Top places</h1><div class="card">${places.map(([n, v]) => `<div class="row"><div>${esc(n)}</div><div class="amt">${inr(v)}</div></div>`).join('')}</div>` : ''}
    <h1>All ${m.length} transaction${m.length === 1 ? '' : 's'}</h1>
    <div class="card">${m.slice().reverse().map(t => txRow({ when: new Date(t[0]).toISOString(), account: short(t[1]), type: t[2] ? 'credit' : 'debit', amount: t[3], merchant: t[4], category: t[6] })).join('')}</div>`;
}

function wireHistory(d) {
  const tx = hFilter(d), B = banks(d).filter(b => H_ACCT === 'all' || b.name === H_ACCT);
  // ── Balance lines: one per bank, using the balance printed in each message ──
  const el = document.getElementById('balChart'), W = el.clientWidth || 320, H = 170, pb = 18, pt = 8;
  const from = Date.now() - H_RANGE * 30.4 * DAY, to = Date.now();
  const series = B.map(b => ({ b, pts: tx.filter(t => t[1] === b.name && t[5] !== null).map(t => [t[0], t[5]]) })).filter(s => s.pts.length);
  const maxV = Math.max(1, ...series.flatMap(s => s.pts.map(p => p[1])));
  const x = t => (t - from) / (to - from) * W, y = v => H - pb - v / maxV * (H - pb - pt);
  const grid = [0, .5, 1].map(f => `<line x1="0" x2="${W}" y1="${y(maxV * f)}" y2="${y(maxV * f)}" stroke="var(--grid)"/><text x="0" y="${y(maxV * f) - 3}">${inrK(maxV * f)}</text>`).join('');
  const ticks = []; for (let k = monthKey(from) + 1; k <= monthKey(to); k++) { const t = new Date(Math.floor(k / 12), k % 12, 1).getTime(); if (H_RANGE <= 3 || (k % 12) % (H_RANGE > 12 ? 6 : 3) === 0) ticks.push(`<text x="${x(t)}" y="${H - 3}" text-anchor="middle">${k % 12 === 0 ? Math.floor(k / 12) : monthName(k)}</text>`); }
  // step line: balance stays the same until the next message
  const lines = series.map(s => { let dStr = ''; s.pts.forEach((p, i) => { dStr += (i ? `H${x(p[0])}V${y(p[1])}` : `M${x(p[0])},${y(p[1])}`); }); dStr += `H${x(to)}`;
    return `<path d="${dStr}" fill="none" stroke="${s.b.color}" stroke-width="2" stroke-linejoin="round"/>`; }).join('');
  el.innerHTML = series.length ? `<svg width="${W}" height="${H}">${grid}${ticks.join('')}${lines}<line id="cross" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><rect width="${W}" height="${H}" fill="transparent" id="balHit"/></svg>`
    : '<p class="note">No balance info in this range.</p>';
  document.getElementById('balLegend').innerHTML = series.length > 1 ? series.map(s => `<span><span class="sw" style="background:${s.b.color}"></span>${esc(short(s.b.name))}</span>`).join('') : '';
  const hit = document.getElementById('balHit');
  if (hit) { const show = ev => { const r = hit.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left, t = from + px / W * (to - from);
      const c = document.getElementById('cross'); c.setAttribute('x1', px); c.setAttribute('x2', px); c.setAttribute('visibility', 'visible');
      document.getElementById('balTip').innerHTML = `<b>${new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</b> · ` +
        series.map(s => { const p = s.pts.filter(q => q[0] <= t).pop(); return `${esc(short(s.b.name))} ${p ? inr(p[1]) : '—'}`; }).join(' · '); };
    hit.addEventListener('click', show); hit.addEventListener('mousemove', show); hit.addEventListener('touchmove', e => { show(e); e.preventDefault(); }, { passive: false }); }

  // ── Monthly in (up) / out (down) bars ──
  const mc = document.getElementById('monChart'), W2 = mc.clientWidth || 320, H2 = 170, mid = 80;
  const k0 = monthKey(from), k1 = monthKey(to), n = k1 - k0 + 1, gap = 2, bw = Math.max(2, W2 / n - gap);
  const agg = {}; tx.forEach(t => { const k = monthKey(t[0]); agg[k] = agg[k] || [0, 0]; agg[k][t[2] ? 0 : 1] += t[3]; });
  // in and out each get their own scale (both labelled), so a salary month doesn't flatten your spending
  const mxIn = Math.max(1, ...Object.values(agg).map(v => v[0])), mxOut = Math.max(1, ...Object.values(agg).map(v => v[1]));
  const sel = H_MONTH !== null ? H_MONTH : (tx.length ? monthKey(tx[tx.length - 1][0]) : -1);
  let bars = `<line x1="0" x2="${W2}" y1="${mid}" y2="${mid}" stroke="var(--grid)"/>`;
  for (let k = k0; k <= k1; k++) { const bx = (k - k0) * (bw + gap), [i, o] = agg[k] || [0, 0], hi = i / mxIn * (mid - 14), ho = o / mxOut * (H2 - mid - 22), r = Math.min(3, bw / 2);
    const op = sel === k || sel < 0 ? 1 : .45;
    if (hi > .5) bars += `<path d="M${bx},${mid - 1}V${mid - hi + r}q0,-${r} ${r},-${r}H${bx + bw - r}q${r},0 ${r},${r}V${mid - 1}Z" fill="var(--in)" opacity="${op}"/>`;
    if (ho > .5) bars += `<path d="M${bx},${mid + 1}V${mid + ho - r}q0,${r} ${r},${r}H${bx + bw - r}q${r},0 ${r},-${r}V${mid + 1}Z" fill="var(--out)" opacity="${op}"/>`;
    if (n <= 12 || k % 6 === 0) bars += `<text x="${bx + bw / 2}" y="${H2 - 3}" text-anchor="middle">${k % 12 === 0 && n > 12 ? Math.floor(k / 12) : monthName(k)}</text>`;
    bars += `<rect class="month" x="${bx - gap / 2}" y="0" width="${bw + gap}" height="${H2}" fill="transparent" onclick="setH('m', ${k})"/>`; }
  bars += `<text x="0" y="10">in, max +${inrK(mxIn)}</text><text x="0" y="${H2 - 16}">out, max −${inrK(mxOut)}</text>`;
  mc.innerHTML = `<svg width="${W2}" height="${H2}">${bars}</svg>`;
}

// ───────── Settings tab ─────────
function settingsView(d) {
  const S = d.settings || { budget: d.budget, categoryBudgets: {}, bigPayment: 0, emailAlerts: true };
  const cats = d.allCategories || d.categories.map(c => c.name);
  const num = (id, v) => `<input id="${id}" type="number" inputmode="numeric" min="0" step="100" value="${v || ''}" placeholder="—">`;
  return `
    <h1>Budget</h1>
    <div class="card">
      <div class="field"><span>Monthly budget (₹)</span>${num('s_budget', S.budget)}</div>
      <div class="field"><span>Warn me about payments over (₹)</span>${num('s_big', S.bigPayment)}</div>
      <div class="field"><span>Email me at 9pm if I'm overspending</span><input id="s_email" type="checkbox" ${S.emailAlerts ? 'checked' : ''}></div>
    </div>
    <h1>Bank balances</h1>
    <div class="card">
      ${(d.accounts || []).filter(a => a.kind === 'bank').map(a => `<div class="field"><span>${esc(a.name.replace(/ A\/c /, ' '))}</span>
        <input data-bal="${esc(a.name)}" type="text" inputmode="text" autocomplete="off" placeholder="${a.balance === null ? 'unknown' : a.balance}"></div>`).join('') || '<p class="note">No banks yet.</p>'}
    </div>
    <p class="note">If a bank's balance looks wrong (for example your bank doesn't send it), type what your bank app shows, with a minus sign if it's negative. After that, every payment in or out updates it automatically.</p>
    <h1>Limits per category</h1>
    <div class="card">
      ${cats.map((c, i) => `<div class="field"><span>${esc(c)}</span><input data-cat="${esc(c)}" type="number" inputmode="numeric" min="0" step="100" value="${S.categoryBudgets[c] || ''}" placeholder="no limit"></div>`).join('')}
    </div>
    <p class="note">Leave a category empty for no limit.</p>
    <h1>Change PIN</h1>
    <div class="card">
      <div class="field"><span>New PIN</span><input id="s_pin" type="password" inputmode="numeric" placeholder="unchanged"></div>
      <div class="field"><span>New PIN again</span><input id="s_pin2" type="password" inputmode="numeric" placeholder="unchanged"></div>
    </div>
    <button id="s_save" onclick="saveSettings()">Save</button>
    <p class="note" id="s_msg"></p>
    <h1>Add an old SMS</h1>
    <div class="card">
      <textarea id="manual" rows="3" placeholder="Paste a bank SMS here"></textarea>
      <button onclick="addManual()">Add</button>
      <p class="note" id="manualMsg"></p>
    </div>
    <button onclick="signOut()" style="background:var(--card);color:var(--crit)">Lock app on this phone</button>`;
}

function saveSettings() {
  const newPin = document.getElementById('s_pin').value.trim();
  const msg = document.getElementById('s_msg');
  if (newPin && !/^\d{4,8}$/.test(newPin)) { msg.textContent = 'PIN must be 4 to 8 digits.'; return; }
  if (newPin !== document.getElementById('s_pin2').value.trim()) { msg.textContent = 'The two new PINs don’t match.'; return; }
  const categoryBudgets = {};
  document.querySelectorAll('input[data-cat]').forEach(i => { if (Number(i.value) > 0) categoryBudgets[i.dataset.cat] = Number(i.value); });
  const setBalances = {};
  document.querySelectorAll('input[data-bal]').forEach(i => { const v = i.value.trim().replace(/[₹,\s]/g, '').replace('−', '-'); if (v !== '' && isFinite(Number(v))) setBalances[i.dataset.bal] = Number(v); });
  const settings = {
    setBalances,
    budget: Number(document.getElementById('s_budget').value) || 0,
    bigPayment: Number(document.getElementById('s_big').value) || 0,
    emailAlerts: document.getElementById('s_email').checked,
    categoryBudgets, newPin: newPin || undefined,
  };
  const btn = document.getElementById('s_save'); btn.disabled = true; btn.textContent = 'Saving…';
  api('saveSettings', { settings }).then(r => {
    btn.disabled = false; btn.textContent = 'Save';
    if (!r.ok) { msg.textContent = r.error || 'Couldn’t save'; return; }
    if (newPin) { PIN = newPin; store.set('pin', PIN); }
    toast('Saved ✓'); sync();
  }).catch(e => { btn.disabled = false; btn.textContent = 'Save'; msg.textContent = 'No connection. Try again.'; });
}

function signOut() {
  store.set('pin', ''); store.set('data', ''); PIN = ''; DATA = null; showLock('');
}

function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

function addManual() {
  const text = document.getElementById('manual').value.trim();
  if (!text) return;
  api('add', { text }).then(r => {
    r = r.result || r;
    document.getElementById('manualMsg').textContent = { added:'Added ✓', duplicate:'Already had that one', skipped:'Not a transaction (OTP/notice)', unparsed:"Couldn't read it. Saved to Unparsed" }[r] || r;
    if (r === 'added') setTimeout(sync, 600);
  });
}

// ── Auto-sync: on open, whenever you come back to the app, and every minute while it's open ──
if (DATA) render();
if (PIN && (IN_GOOGLE || URL_)) sync(); else { if (!DATA) showLock(); if (IN_GOOGLE || URL_) sync(true); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('focus', () => sync());
setInterval(() => { if (!document.hidden) sync(); }, 60000);
setInterval(paintSync, 30000);
if ('serviceWorker' in navigator && !IN_GOOGLE && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
